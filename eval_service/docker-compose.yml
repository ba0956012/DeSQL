services:
  eval-service:
    build:
      context: ..
      dockerfile: eval_service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_DEPLOYMENT=${LLM_DEPLOYMENT}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE}
      - DATA_DIR=/app/data
    env_file:
      - ../.env
    volumes:
      - ../eval/databases:/app/data/databases
      - ../eval/dev.json:/app/data/dev.json
